services:
  remote-shell:
    container_name: "remote-shell"
    build:
      dockerfile: ./Dockerfile.ttyd
      args:
        - ${TTYD_VERSION}
    user: "${PUID}:${PGID}"
    hostname: "remote-shell"
    env_file: .env
    volumes:
      - ${TTYD_SECRET_KEY}:/home/ubuntu/.ssh:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - "global_docker_network"
    restart: unless-stopped

networks:
  global_docker_network:
    external: "true"
    name: "global_docker_network"
