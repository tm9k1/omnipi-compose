services:
  authelia:
    container_name: "authelia"
    image: "authelia/authelia:latest"
    env_file: .env
    environment:
      - "PUID=1000"
      - "PGID=100"
      - "TZ=Asia/Kolkata"
    volumes:
      - "${AUTHELIA_CONFIGS}:/config"
    networks:
      - "global_docker_network"
    restart: "unless-stopped"

  swag:
    container_name: "swag"
    image: "linuxserver/swag"
    env_file: .env
    environment:
      - "PUID=1000"
      - "PGID=100"
      - "TZ=Asia/Kolkata"
      - "URL=${SWAG_URL}"
      - "SUBDOMAINS=${SWAG_SUBDOMAINS}"
      - "DHLEVEL=${SWAG_DHLEVEL}"
      - "STAGING=false"
    volumes:
      - "${SWAG_CONFIGS}/config:/config"
      - "${SWAG_CONFIGS}/services_cache:/var/cache/nginx"
    ports:
      - "${SWAG_HTTPSPORT}:443/tcp"
      - "${SWAG_HTTPPORT}:80/tcp"
    networks:
      - "global_docker_network"
    restart: "unless-stopped"

  errorpage-server:
    image: nginx:alpine
    container_name: errorpage-server
    volumes:
      - "${ERRORPAGE_CONFIGS}/50x:/usr/share/nginx/html:ro"
      - "${ERRORPAGE_CONFIGS}/config:/etc/nginx/"
    ports:
        - "8069:80"
    networks:
      - "global_docker_network"
    restart: "unless-stopped"

networks:
  global_docker_network:
    name: "global_docker_network"
    external: "true"

